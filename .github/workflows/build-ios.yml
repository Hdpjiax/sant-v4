name: Build & Deploy iOS (TestFlight)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      SUPABASE_URL: "https://qdczmcttatoymwlxjtug.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkY3ptY3R0YXRveW13bHhqdHVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MzA4NDcsImV4cCI6MjA5ODUwNjg0N30.vSGLka8d5lwELC6jqqLWUbAk0qBQxZ6YgH1k24TOhBQ"
      API_BASE_URL: "https://sant-v4.vercel.app"
      ADMIN_REGISTRATION_CODE: "SANTANDER_ADMIN_2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Setup App Store Connect Private Key
        if: env.APPSTORE_KEY_ID != ''
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          mkdir -p ~/.private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Build and Upload to TestFlight
        if: env.APPSTORE_KEY_ID != ''
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd ios/App
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Build Unsigned (Fallback)
        if: env.APPSTORE_KEY_ID == ''
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/build/*.ipa
          if-no-files-found: ignore

