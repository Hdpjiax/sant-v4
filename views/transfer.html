        <div id="transfer-view" class="hidden-view">
            <header class="detail-header">
                <span class="material-icons-outlined icon-red back-btn">arrow_back</span>
                <h2>Transferir</h2>
                <span class="material-icons-outlined icon-red">more_vert</span>
            </header>
            <div class="page-content">
                <div class="feature-card" style="margin-bottom:16px;">
                    <h3 style="display:flex;align-items:center;justify-content:space-between;">
                        <span>Beneficiarios</span>
                        <button id="btn-add-beneficiary" class="ben-add-btn" type="button"
                            title="Agregar beneficiario">+</button>
                    </h3>
                    <div class="beneficiary-grid" id="beneficiary-list"></div>
                    <div id="beneficiary-form" class="ben-form hidden-ben-form">
                        <input type="text" id="ben-new-name" placeholder="Nombre" maxlength="40">
                        <input type="text" id="ben-new-clabe" placeholder="CLABE (18 dígitos)" maxlength="18"
                            inputmode="numeric">
                        <div class="ben-form-actions">
                            <button id="ben-cancel" class="btn-outline" type="button">Cancelar</button>
                            <button id="ben-save" class="primary-action-btn" type="button"
                                style="flex:1;">Guardar</button>
                        </div>
                    </div>
                </div>
                <div class="mock-form">
                    <label for="transfer-dest">Cuenta destino / CLABE / Celular</label>
                    <input type="text" id="transfer-dest" placeholder="Ej. 012345678901234567" autocomplete="off">

                    <label for="transfer-amount">Importe (MXN)</label>
                    <input type="number" id="transfer-amount" placeholder="$ 0.00" min="1" step="0.01">

                    <label for="transfer-concept">Concepto de pago</label>
                    <input type="text" id="transfer-concept" placeholder="Ej. Pago de cena" maxlength="140">

                    <button class="primary-action-btn mt-20" id="btn-do-transfer">Continuar</button>
                </div>
            </div>
        </div>
